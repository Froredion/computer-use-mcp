name: CI/CD

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [lts/*, current]
        include:
          - os: windows-latest
            node-version: lts/*
    env:
      CI: true
    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm run test --if-present
      - name: Prepare MCPB artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 'lts/*'
        run: |
          npm run build:mcpb
          mkdir -p .github/tmp
          unzip computer-use-mcp.mcpb -d .github/tmp
      - name: Upload MCPB artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 'lts/*'
        uses: actions/upload-artifact@v4
        with:
          name: computer-use-mcp-mcpb
          path: .github/tmp/*

  # Upstream also publishes to npm and the MCP Registry with its own credentials; this fork
  # only cuts a GitHub Release with the MCPB bundle attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CI: true
    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Build MCPB
        run: npm run build:mcpb
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: computer-use-mcp.mcpb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
